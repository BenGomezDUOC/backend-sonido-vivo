# ===================================================================
# Configuración Spring Boot — Tienda Sonido Vivo API REST
# DSY1104 · Desarrollo Full Stack II · Evaluación Parcial 3 (EP3)
# ===================================================================

spring.application.name=backend-sonidovivo
server.port=8080

# Conexión MySQL (XAMPP Puerto 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/sonidovivo_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuración JWT (JSON Web Token)
# Clave HMAC-SHA256 de 256 bits (32 bytes) codificada
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiración: 24 horas (86400000 milisegundos)
app.jwt.expiration-ms=86400000

# Swagger UI / OpenAPI 3
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
